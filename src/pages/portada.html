<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-gesture-detector@3.3.0/dist/aframe-gesture-detector.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-super-hands-component@4.0.5/dist/aframe-super-hands.min.js"></script>

    <style>
      #botones-ui {
        display: none;
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 999;
      }

      #botones-ui button {
        margin: 5px;
        padding: 10px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <a-scene
  mindar-image="imageTargetSrc: ../../assets/markers/portada/targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded
  gesture-detector
>
      <a-assets>
        <a-asset-item id="avatarModel" src="../../assets/3D/ballenaAzul.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 1.6 0" look-controls="enabled: false"></a-camera>

      <!-- Target AR -->
      <a-entity mindar-image-target="targetIndex: 0" id="target"></a-entity>

      <!-- Contenedor de rotación con el modelo adentro -->
      <a-entity
        id="modelo-contenedor"
        rotation="0 0 0"
        position="0 1 -15"    
        scale="1 1 1"
        gesture-handler
        gesture-rotate="enabled: false"
      >
        <!-- Modelo GLTF animado -->
        <a-gltf-model
          id="ballena"
          src="#avatarModel"
          position="0 0 0"
          visible="false"
          animation-mixer="loop: once; clampWhenFinished: true"
        ></a-gltf-model>
      </a-entity>
    </a-scene>

    <!-- Botones UI -->
    <div id="botones-ui">
      <button onclick="accion1()">Botón 1</button>
      <button onclick="accion2()">Botón 2</button>
    </div>

    <script>
      AFRAME.registerComponent('gesture-rotate', {
  schema: { enabled: { default: true } },

  init: function () {
    this.enabled = this.data.enabled;
    this.rotation = this.el.object3D.rotation;

    this.isMouseDown = false;
    this.startX = 0;
    this.startY = 0;

    // Rotación táctil - usa movimiento en X para Yaw (rotar en Y) y en Y para Pitch (rotar en X)
    this.el.sceneEl.addEventListener('onefingermove', (e) => {
      if (!this.enabled) return;
      const dx = e.detail.positionChange.x;
      const dy = e.detail.positionChange.y;
      this.rotation.y += dx * 0.01; // girar horizontal (yaw)
      this.rotation.x += dy * 0.01; // girar vertical (pitch)
      // Opcional: limitar rotación en X para no dar vuelta completa vertical
      this.rotation.x = Math.min(Math.max(this.rotation.x, -Math.PI / 2), Math.PI / 2);
    });

    // Mouse down
    this.onMouseDown = (e) => {
      if (!this.enabled) return;
      this.isMouseDown = true;
      this.startX = e.clientX;
      this.startY = e.clientY;
    };

    // Mouse move: mueve en X para rotar en Y, y en Y para rotar en X
    this.onMouseMove = (e) => {
      if (!this.enabled || !this.isMouseDown) return;
      const dx = e.clientX - this.startX;
      const dy = e.clientY - this.startY;
      this.rotation.y += dx * 0.005;
      this.rotation.x += dy * 0.005;
      this.rotation.x = Math.min(Math.max(this.rotation.x, -Math.PI / 2), Math.PI / 2);
      this.startX = e.clientX;
      this.startY = e.clientY;
    };

    this.onMouseUp = () => {
      this.isMouseDown = false;
    };

    window.addEventListener('mousedown', this.onMouseDown);
    window.addEventListener('mousemove', this.onMouseMove);
    window.addEventListener('mouseup', this.onMouseUp);
  },

  update: function () {
    this.enabled = this.data.enabled;
  },

  remove: function () {
    window.removeEventListener('mousedown', this.onMouseDown);
    window.removeEventListener('mousemove', this.onMouseMove);
    window.removeEventListener('mouseup', this.onMouseUp);
  }
});


      // Component para manejar animación + UI
      AFRAME.registerComponent('one-time-animation', {
        init: function () {
          const model = document.querySelector('#ballena');
          const target = document.querySelector('#target');
          const botones = document.getElementById('botones-ui');
          const contenedor = document.querySelector('#modelo-contenedor');
          let alreadyPlayed = false;

          target.addEventListener('targetFound', () => {
            const escaneador = document.querySelector('.scanning');
            if (escaneador) escaneador.style.opacity = '0';

            model.setAttribute('visible', 'true');

            if (!alreadyPlayed) {
              model.components['animation-mixer'].stopAction(); // Reset
              model.components['animation-mixer'].playAction(); // Play
              alreadyPlayed = true;

              // Detectar fin de animación
              model.addEventListener('animation-finished', () => {
                console.log('✅ Animación terminada');

                // Mostrar botones
                botones.style.display = 'block';

                // Activar rotación por gesto
                contenedor.setAttribute('gesture-rotate', 'enabled: true');
              });
            }
          });

          target.addEventListener('targetLost', () => {
            model.setAttribute('visible', 'true'); // Puedes cambiar a false si prefieres ocultarlo
          });
        }
      });

      // Activar componente
      document.addEventListener('DOMContentLoaded', () => {
        document.querySelector('#target').setAttribute('one-time-animation', '');
      });

      // Acciones de los botones
      function accion1() {
        alert('Acción 1 ejecutada');
      }

      function accion2() {
        alert('Acción 2 ejecutada');
      }
    </script>
  </body>
</html>
