  position: fixed;

  max-height: 80vh;              /* no más alto que 80% de la ventana */

  color: white;
  backdrop-filter: blur(10px);
  transition: transform 0.4s ease, opacity 0.3s ease;
  z-index: 999;
  padding: 20px 30px;
  box-shadow: 5px 5px 20px rgba(0, 0, 0, 0.3);

  opacity: 0;                    /* inicia oculto */

    <script>
      AFRAME.registerComponent('gesture-rotate', {
  schema: { enabled: { default: true } },

  init: function () {
    this.enabled = this.data.enabled;
    this.rotation = this.el.object3D.rotation;

    this.isMouseDown = false;
    this.startX = 0;
    this.startY = 0;

    // Rotación táctil - usa movimiento en X para Yaw (rotar en Y) y en Y para Pitch (rotar en X)
    this.el.sceneEl.addEventListener('onefingermove', (e) => {
      if (!this.enabled) return;
      const dx = e.detail.positionChange.x;
      const dy = e.detail.positionChange.y;
      this.rotation.y += dx * 0.01; // girar horizontal (yaw)
      this.rotation.x += dy * 0.01; // girar vertical (pitch)
      // Opcional: limitar rotación en X para no dar vuelta completa vertical
      this.rotation.x = Math.min(Math.max(this.rotation.x, -Math.PI / 2), Math.PI / 2);
    });

    // Mouse down
    this.onMouseDown = (e) => {
      if (!this.enabled) return;
      this.isMouseDown = true;
      this.startX = e.clientX;
      this.startY = e.clientY;
    };

    // Mouse move: mueve en X para rotar en Y, y en Y para rotar en X
    this.onMouseMove = (e) => {
      if (!this.enabled || !this.isMouseDown) return;
      const dx = e.clientX - this.startX;
      const dy = e.clientY - this.startY;
      this.rotation.y += dx * 0.005;
      this.rotation.x += dy * 0.005;
      this.rotation.x = Math.min(Math.max(this.rotation.x, -Math.PI / 2), Math.PI / 2);
      this.startX = e.clientX;
      this.startY = e.clientY;
    };

    this.onMouseUp = () => {
      this.isMouseDown = false;
    };

    window.addEventListener('mousedown', this.onMouseDown);
    window.addEventListener('mousemove', this.onMouseMove);
    window.addEventListener('mouseup', this.onMouseUp);
  },

  update: function () {
    this.enabled = this.data.enabled;
  },

  remove: function () {
    window.removeEventListener('mousedown', this.onMouseDown);
    window.removeEventListener('mousemove', this.onMouseMove);
    window.removeEventListener('mouseup', this.onMouseUp);
  }
});

<script>
document.addEventListener("DOMContentLoaded", () => {
  const scene = document.querySelector("a-scene");
  const cursor = document.querySelector("#mouse-cursor");
  const target = document.querySelector("#target");

  // ⚙️ Configurar raycaster
  cursor.setAttribute("raycaster", {
    objects: ".clickable, [data-raycastable]",
    far: 1000,
    recursive: true
  });

  // ✅ Esperar modelos cargados
  const esperarModelos = async () => {
    const modelos = Array.from(document.querySelectorAll(".clickable"));
    if (modelos.length === 0) return [];
    await Promise.all(
      modelos.map(
        m =>
          new Promise(resolve => {
            if (m.hasLoaded) return resolve();
            m.addEventListener("model-loaded", resolve, { once: true });
          })
      )
    );
    return modelos;
  };

  // ✅ Refrescar raycaster
  const refrescarRaycaster = () => {
    if (cursor.components?.raycaster) {
      cursor.components.raycaster.refreshObjects();
      console.log("🔵 Raycaster actualizado.");
    }
  };

  // 🟢 Target detectado
  target.addEventListener("targetFound", async () => {
    console.log("📸 Target detectado. Esperando modelos...");
    const modelos = await esperarModelos();
    refrescarRaycaster();
    console.log("🟢 Modelos listos:", modelos.map(m => m.id));
  });

  // ✅ Click handler
  const manejarClickRaycaster = () => {
    const raycaster = cursor.components?.raycaster;
    if (!raycaster) return;
    const intersecciones = raycaster.intersectedEls;
    if (!intersecciones || intersecciones.length === 0) return;

    const primero = intersecciones[0];
    if (primero.classList.contains("clickable")) {
      console.log("✅ Clic detectado en:", primero.id);
      const panel = document.getElementById("panelInfo");
      const contenido = document.getElementById("contenidoPanel");
      contenido.innerHTML = `<h2>${primero.id}</h2><p>Contenido del modelo ${primero.id}.</p>`;
      panel.classList.add("mostrar");
    }
  };

  // 🟣 Cerrar panel
  const cerrarPanel = document.getElementById("cerrarPanel");
  if (cerrarPanel) {
    cerrarPanel.addEventListener("click", () => {
      document.getElementById("panelInfo").classList.remove("mostrar");
    });
  }

  // ⚡ Redirigir clics del canvas de MindAR al raycaster
  const reenviarClickDesdeCanvas = () => {
    const canvas = document.querySelector("canvas");
    if (!canvas) return;

    // Por defecto MindAR pone pointer-events: auto
    canvas.style.pointerEvents = "auto";

    // Captura clics sobre el video o canvas y dispara el raycaster manualmente
    canvas.addEventListener("mousedown", () => {
      manejarClickRaycaster();
    });
    canvas.addEventListener("touchstart", () => {
      manejarClickRaycaster();
    });

    console.log("✅ Canvas MindAR listo para reenviar clics.");
  };

  // ⚙️ Cuando la escena carga
  scene.addEventListener("loaded", () => {
    setTimeout(() => {
      refrescarRaycaster();
      reenviarClickDesdeCanvas();
    }, 1000);
  });
});
</script>


<script>
document.addEventListener("DOMContentLoaded", () => {
  const sceneEl = document.querySelector("a-scene");
  if (!sceneEl) return console.error("No se encontró <a-scene>");

  // Espera a que la escena A-Frame esté lista y tenga cámara/renderer
  sceneEl.addEventListener("loaded", () => {
    const threeCamera = sceneEl.camera; // THREE.Camera
    const renderer = sceneEl.renderer;
    if (!threeCamera || !renderer) {
      console.error("Cámara o renderer no disponibles aún.");
      return;
    }

    const raycaster = new AFRAME.THREE.Raycaster();
    const mouse = new AFRAME.THREE.Vector2();

    // Devuelve el <canvas> utilizado por A-Frame / MindAR
    const canvas = renderer.domElement;

    // Obtiene lista de entidades clickeables (actualiza dinámicamente)
    function getClickableEntities() {
      return Array.from(document.querySelectorAll(".clickable"))
        .filter(el => el.object3D); // asegurarnos de que tengan object3D
    }

    // Convierte evento (mouse o touch) a coordenadas NDC (-1..1)
    function eventToNDC(ev) {
      const rect = canvas.getBoundingClientRect();
      let clientX, clientY;
      if (ev.touches && ev.touches.length) {
        clientX = ev.touches[0].clientX;
        clientY = ev.touches[0].clientY;
      } else {
        clientX = ev.clientX;
        clientY = ev.clientY;
      }
      const x = ((clientX - rect.left) / rect.width) * 2 - 1;
      const y = -((clientY - rect.top) / rect.height) * 2 + 1;
      return { x, y };
    }

    // Dado un intersection.object (THREE.Object3D), subir padres hasta encontrar `el`
    function getEntityFromObject3D(obj) {
      while (obj) {
        if (obj.el) return obj.el;
        obj = obj.parent;
      }
      return null;
    }

    // Raycast manual y manejo del primer objeto intersectado
    function doRaycastAndHandle(ndc) {
      mouse.set(ndc.x, ndc.y);
      raycaster.setFromCamera(mouse, threeCamera);

      // Construir lista de objetos raíz para intersectObjects
      const clickable = getClickableEntities();
      if (clickable.length === 0) return;

      const objects = clickable.map(el => el.object3D);
      // intersectObjects acepta array de objetos y recursivo = true
      const intersections = raycaster.intersectObjects(objects, true);

      if (intersections && intersections.length) {
        // Tomar la intersección más cercana
        const first = intersections[0];
        const hitEl = getEntityFromObject3D(first.object);
        if (hitEl && hitEl.classList && hitEl.classList.contains("clickable")) {
          // Acción al clicar el modelo (mantén tu lógica aquí)
          console.log("✅ Modelo clickeado (raycast):", hitEl.id || hitEl.tagName);

          // Mostrar panel (manteniendo tu UI)
          const panel = document.getElementById("panelInfo");
          const contenido = document.getElementById("contenidoPanel");
          contenido.innerHTML = `
            <h2 style="text-align:center;">${hitEl.id || "Modelo"}</h2>
            <p style="color:#e0f7fa;">Has hecho clic en ${hitEl.id || "un modelo"}.</p>
          `;
          panel.classList.add("mostrar");

          // Evitar que el click "caiga" en otros listeners
          return true;
        }
      }
      return false;
    }

    // Handler unificado para mousedown / touchstart
    function onPointerDown(ev) {
      try {
        const ndc = eventToNDC(ev);
        const handled = doRaycastAndHandle(ndc);
        if (handled) {
          ev.preventDefault();
          ev.stopPropagation();
        }
      } catch (err) {
        console.error("Error en raycast:", err);
      }
    }

    // Escuchar tanto sobre el canvas como a nivel ventana (por si MindAR intercepta)
    canvas.addEventListener("mousedown", onPointerDown, { passive: false });
    canvas.addEventListener("touchstart", onPointerDown, { passive: false });

    // Backup: también ventana (útil en algunos navegadores)
    window.addEventListener("mousedown", onPointerDown, { passive: false });
    window.addEventListener("touchstart", onPointerDown, { passive: false });

    // Cuando modelos cambien de visibilidad (cuando targetFound), refrescamos log para debug
    const target = document.querySelector("#target");
    if (target) {
      target.addEventListener("targetFound", () => {
        console.log("📸 targetFound -> actualizando lista de clickeables:", getClickableEntities().map(e=>e.id));
      });
    }

    console.log("🔦 Raycast manual listo (THREE.Raycaster).");
  });
});
</script>
